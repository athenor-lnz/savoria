<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="../manifest.webmanifest"><title>SavoRia — Français</title><style>:root{font-family:system-ui,sans-serif;--bg:#f5f7fb;--ink:#18243b;--card:#fff;--sub:#eaf0f8;--accent:#3576ee}html[data-theme=dark]{--bg:#101725;--ink:#ecf1fa;--card:#202e43;--sub:#30435d;--accent:#8bb6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:760px;margin:auto;padding:18px 16px 45px}.top{display:flex;gap:12px;align-items:center}.top a{font-size:25px;text-decoration:none;color:var(--accent)}.top h1{font-size:27px}.ver{margin-left:auto;font-size:12px;opacity:.65}.card{background:var(--card);padding:24px;border-radius:22px;margin:16px 0;box-shadow:0 5px 25px #0000000a}.muted{font-size:13px;opacity:.7}.stats{display:flex;gap:8px}.stats span{background:var(--sub);padding:10px;border-radius:12px;flex:1;text-align:center}.sentence{font-size:clamp(20px,4vw,30px);font-weight:750;line-height:1.6}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answers button,.btn{border:0;border-radius:13px;padding:17px 12px;font:inherit;font-weight:700;background:var(--sub);color:var(--ink);cursor:pointer;min-height:54px}.btn.primary{background:var(--accent);color:#fff}.feedback{line-height:1.6;min-height:40px}.correction{background:var(--sub);padding:16px;border-radius:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.topic{display:flex;flex-wrap:wrap;gap:9px}.topic button{border:1px solid var(--accent);border-radius:99px;background:var(--sub);color:var(--ink);padding:11px;font:inherit}.topic button.active{background:var(--accent);color:white}input{font:inherit;padding:14px;border-radius:12px;border:1px solid #98a8c2;background:var(--card);color:var(--ink);width:100%}button:disabled{opacity:.5}@media(max-width:500px){.card{padding:17px}.top h1{font-size:23px}}.answers{gap:12px}.answers button{min-height:62px}.answers button:disabled{opacity:.78}.correction{margin-top:12px;padding:15px 16px;line-height:1.65}.sentence{margin:28px 0}.card{border:1px solid #8294b126}.stats span{font-size:14px}.topic{gap:7px}.topic button{font-size:14px}.actions .btn:first-child{background:var(--accent);color:white}@media(min-width:800px){main{max-width:950px}.card{padding:30px}}@media(max-width:700px){main{padding:12px 12px 26px}.card{margin:11px 0}.top{margin-bottom:8px}.sentence{margin:18px 0}.answers button{min-height:57px}.topic button{padding:9px 11px}.stats span{padding:8px 5px;font-size:12px}}</style></head><body><main><header class="top"><a href="../">←</a><h1>Français</h1><span class="ver">v2.2.1</span></header><p class="muted">Orthographe et dictées à trous · Une explication après chaque erreur</p><div class="topic"><button data-topic="mixte" class="active">Tout mélanger</button><button data-topic="homophones">Homophones</button><button data-topic="accords">Accords</button><button data-topic="conjugaison">Conjugaison</button></div><section class="card"><div class="stats"><span>✅ <b id="score">0</b> <span id="successWord">réussites</span></span><span>📝 <b id="attempts">0</b> <span id="answerWord">réponses</span></span><span>🎯 <b id="rate">—</b></span></div><p class="muted" id="category"></p><p id="sentence" class="sentence"></p><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="next">Passer</button><button class="btn" id="restart">Recommencer</button></div></section><section class="card"><h2>Ce que tu apprends</h2><p class="muted">Les règles expliquées après une erreur sont réutilisées dans de futurs exercices. La progression est enregistrée localement.</p><p id="difficulties"></p></section></main><script>'use strict';let pref={};try{pref=JSON.parse(localStorage.getItem('savoria-settings-v2')||'{}')}catch{}document.documentElement.dataset.theme=pref.theme==='dark'?'dark':pref.theme==='light'?'light':matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const $=id=>document.getElementById(id);const exercises=[['homophones','Les enfants ___ terminé leurs devoirs.','ont',['ont','on','ons','a'],'« Ont » est le verbe avoir : on peut le remplacer par « avaient ».'],['homophones','Il ___ levé tôt ce matin.','s’est',['s’est','c’est','ses','ces'],'« S’est » accompagne un verbe pronominal : il s’est levé.'],['homophones','___ livres sont sur la table.','Ces',['Ces','Ses','C’est','S’est'],'« Ces » désigne les livres que l’on montre. « Ses » exprime l’appartenance.'],['homophones','Elle ___ un nouveau vélo.','a',['a','à','as','ah'],'« A » est le verbe avoir : elle avait un nouveau vélo.'],['homophones','___ est ton cahier ?','Où',['Où','Ou','Hou','Oú'],'« Où » indique un lieu. « Ou » propose un choix.'],['homophones','Il ___ encore du pain.','reste',['reste','restes','restent','restons'],'Avec le sujet impersonnel « il », le verbe reste au singulier.'],['accords','Les fleurs sont ___.','belles',['belles','belle','beaux','bel'],'L’adjectif s’accorde au féminin pluriel avec « fleurs ».'],['accords','Une robe ___ est suspendue.','bleue',['bleue','bleu','bleus','bleues'],'« Robe » est féminin singulier : on écrit « bleue ».'],['accords','Les chiens ___ dans le jardin.','jouent',['jouent','joue','joues','jouons'],'Sujet pluriel : « les chiens jouent ».'],['accords','Les élèves sont ___.','attentifs',['attentifs','attentif','attentives','attentive'],'Un adjectif s’accorde avec le nom au masculin pluriel.'],['conjugaison','Demain, nous ___ au musée.','irons',['irons','allons','ira','irez'],'Le mot « demain » indique le futur : nous irons.'],['conjugaison','Hier, tu ___ un livre.','as lu',['as lu','a lu','liras','lis'],'Au passé composé : « tu as lu ».'],['conjugaison','Tous les jours, je ___ à vélo.','viens',['viens','vient','venons','viennent'],'Au présent, « je » prend « viens » avec le verbe venir.'],['conjugaison','Si tu travaillais, tu ___ davantage.','réussirais',['réussirais','réussiras','réussissait','réussissez'],'Après cette hypothèse à l’imparfait, le conditionnel est adapté : tu réussirais.']];let topic='mixte',q=null,answered=false,state={ok:0,total:0,wrong:{}};try{state=JSON.parse(localStorage.getItem('savoria-francais-v1')||'null')||state}catch{}function store(){localStorage.setItem('savoria-francais-v1',JSON.stringify(state))}function renderStats(){$('score').textContent=state.ok;$('attempts').textContent=state.total;$('successWord').textContent=state.ok===1?'réussite':'réussites';$('answerWord').textContent=state.total===1?'réponse':'réponses';$('rate').textContent=state.total?Math.round(100*state.ok/state.total)+' %':'—';let sorted=Object.entries(state.wrong).sort((a,b)=>b[1]-a[1]);$('difficulties').textContent=sorted.length?'À réviser : '+sorted.map(([name,n])=>name+' ('+n+' erreurs)').join(', '):'Aucune difficulté identifiée pour le moment.'}function next(){answered=false;const pool=exercises.filter(x=>topic==='mixte'||x[0]===topic);const weights=pool.flatMap(x=>Array(1+Math.min(3,state.wrong[x[0]]||0)).fill(x));q=weights[Math.floor(Math.random()*weights.length)];$('category').textContent='Catégorie : '+q[0];$('sentence').textContent=q[1];$('feedback').textContent='';$('next').textContent='Passer';$('answers').replaceChildren();for(const text of [...q[3]].sort(()=>Math.random()-.5)){const b=document.createElement('button');b.textContent=text;b.onclick=()=>answer(text);$('answers').append(b)}}function answer(text){if(answered)return;answered=true;const ok=text===q[2];state.total++;if(ok)state.ok++;else state.wrong[q[0]]=(state.wrong[q[0]]||0)+1;store();renderStats();$('feedback').innerHTML='<div class="correction"><strong>'+(ok?'✅ Bonne réponse !':'❌ La bonne réponse est « '+q[2]+' ».')+'</strong>'+(ok?'':'<p>'+q[4]+'</p>')+'</div>';$('next').textContent='Question suivante →';$('answers').querySelectorAll('button').forEach(b=>b.disabled=true)}document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;document.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('active',x===b));next()});$('next').onclick=next;$('restart').onclick=()=>{if(!confirm('Remettre les statistiques de français à zéro ?'))return;state={ok:0,total:0,wrong:{}};store();renderStats();next()};renderStats();next();</script></body></html>
