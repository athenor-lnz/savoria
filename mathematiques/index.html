onbar"><span>SavoRia · v1.8.0</span><button type="button" id="forceUpdate">↻ Vérifier les mises à jour</button></div><section id="menu"><div class="controls"><label>Niveau<select id="level"><option value="debutant">Débutant</option><option value="primaire" selected>Primaire</option><option value="college">Intermédiaire</option><option value="expert">Expert</option><option value="adaptatif">Adaptatif</option></select></label><label>Opérations<select id="ops"><option value="mixte">Mélangées</option><option value="+">Addition +</option><option value="-">Soustraction −</option><option value="*">Multiplication ×</option><option value="/">Division ÷</option></select></label><label>Chrono<select id="duration"><option value="30">30 secondes</option><option value="60" selected>1 minute</option><option value="180">3 minutes</option><option value="300">5 minutes</option></select></label><label>Profil<select id="profile"><option>Joueur 1</option><option>Joueur 2</option><option>Joueur 3</option><option>Joueur 4</option></select></label></div><div class="modes" id="modes"></div><div id="records" class="panel"></div><div id="report" class="panel report"></div></section><section id="game" class="hidden"><button class="secondary" id="back">← Retour aux modes</button><h2 id="title"></h2><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Réussites<b id="count">0</b></div><div class="stat"><span id="specialname">Série</span><b id="special">0</b></div></div><div id="play"></div><p class="result" id="feedback" aria-live="polite"></p></section></main><div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-label="Paramètres"><div class="sheetbox"><h2 style="margin:0">⚙️ Paramètres</h2><label>Prénom<input id="firstName" maxlength="30" placeholder="Ton prénom"></label><label>Apparence<select id="theme"><option value="auto">Système</option><option value="light">Clair</option><option value="dark">Sombre</option></select></label><button id="saveSettings">Enregistrer</button><button class="secondary" id="closeSettings" type="button">Fermer</button></div></div><script>'use strict';const el=id=>document.getElementById(id),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],sym={'+':'+','-':'−','*':'×','/':'÷'},modes=[['infini','♾️','Calcul infini','Sans limite et sans pression'],['cible','🎯','Nombre cible','Combine les nombres'],['chrono','⏱️','Chrono','Bats ton record'],['adaptatif','🧠','Progression','Difficulté évolutive'],['survie','❤️','Survie','Trois vies'],['duel','⚔️','Duel','Deux joueurs, même écran']];let g=null,tick=null,flashTimer=null;const KEY='savoria-settings-v2',METRICS='savoria-maths-analytics-v1';let pref={};try{pref=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}function applyTheme(){document.documentElement.dataset.theme=pref.theme==='dark'?'dark':pref.theme==='light'?'light':matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);const cfg=()=>({level:el('level').value,ops:el('ops').value,duration:+el('duration').value,profile:el('profile').value});function generate(level,choice){const max={debutant:10,primaire:100,college:500,expert:5000}[level]||100,op=choice==='mixte'?P(['+','-','*','/']):choice;let a,b;if(op==='*'){const cap={debutant:5,primaire:12,college:35,expert:99}[level];a=R(2,cap);b=R(2,cap)}else if(op==='/'){b=R(2,level==='expert'?60:12);a=b*R(1,level==='expert'?90:12)}else{a=R(1,max);b=R(1,max);if(op==='-'&&b>a)[a,b]=[b,a]}return{a,b,op,answer:op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b}}function level(){if(g.mode!=='adaptatif'&&g.config.level!=='adaptatif')return g.config.level;const accuracy=g.tries?g.ok/g.tries:1;return ['debutant','primaire','college','expert'][Math.min(3,Math.floor(g.ok/7)+(accuracy>.85?1:0))]}function stats(){el('score').textContent=g.mode==='duel'?g.duel.join('–'):g.score;el('count').textContent=g.ok+'/'+g.tries;el('specialname').textContent=g.mode==='chrono'?'Temps':g.mode==='survie'?'Vies':g.mode==='duel'?'Tour':'Série';el('special').textContent=g.mode==='chrono'?g.time+' s':g.mode==='survie'?'❤️'.repeat(g.lives):g.mode==='duel'?'J'+(g.turn+1):g.streak}function tell(t,ok){el('feedback').textContent=t;el('feedback').className='result '+(ok?'good':'error')}function metrics(){try{return JSON.parse(localStorage.getItem(METRICS)||'{}')}catch{return {}}}function logResponse(ok,seconds,op,lev){const all=metrics(),key=g.config.profile,arr=all[key]||[];arr.push({date:Date.now(),mode:g.mode,op,level:lev,correct:ok,seconds:Math.round(seconds*10)/10});if(arr.length>3000)arr.splice(0,arr.length-3000);all[key]=arr;localStorage.setItem(METRICS,JSON.stringify(all))}function renderReport(){const data=(metrics()[el('profile').value]||[]).filter(x=>['+','-','*','/'].includes(x.op)),recent=data.slice(-300),avg=arr=>arr.length?(arr.reduce((a,x)=>a+x.seconds,0)/arr.length).toFixed(1):'—';if(!recent.length){el('report').innerHTML='<h3>📊 Analyse des apprentissages</h3><p class="muted">Termine quelques calculs pour visualiser ta vitesse, ta précision et les opérations à retravailler.</p>';return}const good=recent.filter(x=>x.correct).length,weak=[];let rows=['+','-','*','/'].map(op=>{let arr=recent.filter(x=>x.op===op),ok=arr.filter(x=>x.correct).length,rate=arr.length?Math.round(100*ok/arr.length):0;if(arr.length>=5&&(rate<80||Number(avg(arr))>Math.max(8,Number(avg(recent))*1.35)))weak.push(sym[op]);return '<div class="reportrow"><b>'+sym[op]+'</b><div><div class="track"><div class="fill" style="width:'+rate+'%"></div></div><small class="muted">'+arr.length+' calculs · '+avg(arr)+' s en moyenne</small></div><b>'+ (arr.length?rate+'%':'—') +'</b></div>'}).join('');const first=recent.slice(0,Math.min(30,recent.length)),last=recent.slice(-Math.min(30,recent.length));el('report').innerHTML='<h3>📊 Analyse des apprentissages</h3><p><strong>'+recent.length+'</strong> réponses · <strong>'+Math.round(100*good/recent.length)+' %</strong> de réussite · <strong>'+avg(recent)+' s</strong> par réponse</p>'+rows+'<p class="muted">Vitesse : début '+avg(first)+' s → récent '+avg(last)+' s</p><p><b>À travailler :</b> '+(weak.length?weak.join(', '):'Continue à t’entraîner pour une analyse plus précise.')+'</p><small class="muted">Données conservées dans ce navigateur, par profil. Analyse sur les 300 derniers calculs.</small>'}function records(){let all=JSON.parse(localStorage.getItem('savoria-maths-records')||'{}'),rec=all[el('profile').value]||{};el('records').innerHTML='<b>🏆 Records personnels</b><p class="muted">'+modes.map(m=>m[2]+': '+(rec[m[0]]||0)).join(' · ')+'</p>'}function leave(){clearTimeout(flashTimer);clearInterval(tick);tick=null;g=null;el('game').classList.add('hidden');el('menu').classList.remove('hidden');records();renderReport()}function start(mode){clearInterval(tick);g={mode,config:cfg(),score:0,ok:0,tries:0,streak:0,lives:3,time:+el('duration').value,duel:[0,0],turn:0,turns:0,ended:false,paused:false,shownAt:0};el('menu').classList.add('hidden');el('game').classList.remove('hidden');el('title').textContent=modes.find(m=>m[0]===mode)[2];el('feedback').textContent='';if(mode==='cible')target();else next();if(mode==='chrono'){tick=setInterval(()=>{if(!g||g.ended||g.paused)return;g.time--;stats();if(g.time<=0)finish()},1000)}}function next(){if(g.ended)return;if(g.mode==='duel'&&g.turns>=20)return finish();g.q=generate(level(),g.config.ops);g.shownAt=performance.now();g.questionLevel=level();stats();el('play').innerHTML='<div class="panel"><p class="hint">'+(g.mode==='duel'?'Au joueur '+(g.turn+1)+' de jouer':'Combien font…')+'</p><div class="equation">'+g.q.a+' '+sym[g.q.op]+' '+g.q.b+' = ?</div><form id="form"><input id="answer" aria-label="Réponse" type="text" inputmode="none" autocomplete="off" class="answerfield" required placeholder="Ta réponse"><div class="keypad" id="keypad"></div><div class="actions bottomaction"><button class="primary">Valider</button><button type="button" class="secondary" id="skip">Passer</button></div></form></div>';el('keypad').innerHTML=['1','2','3','4','5','6','7','8','9','−','0','⌫'].map(k=>'<button type="button" data-key="'+k+'">'+k+'</button>').join('');el('keypad').onclick=e=>{const b=e.target.closest('[data-key]');if(!b)return;const inp=el('answer');if(b.dataset.key==='⌫')inp.value=inp.value.slice(0,-1);else if(b.dataset.key==='−'){inp.value=inp.value.startsWith('-')?inp.value.slice(1):'-'+inp.value}else inp.value+=b.dataset.key};el('form').onsubmit=e=>{e.preventDefault();judge(Number(el('answer').value))};el('skip').onclick=()=>judge(null);/* clavier intégré pour jeu à une main */}function judge(value){if(g.ended||g.paused)return;const q=g.q,ok=value===q.answer;logResponse(ok,(performance.now()-g.shownAt)/1000,q.op,g.questionLevel);g.tries++;g.streak=ok?g.streak+1:0;if(ok){g.ok++;g.score+=10+Math.min(g.streak,10);if(g.mode==='duel')g.duel[g.turn]++}else if(g.mode==='survie')g.lives--;if(g.mode==='duel'){g.turn=1-g.turn;g.turns++}stats();if(!ok){showCorrection(q);return}g.paused=true;el('play').innerHTML='<div class="panel successflash" role="status"><span style="font-size:72px">✅</span><h2>Bravo !</h2><p>'+q.a+' '+sym[q.op]+' '+q.b+' = '+q.answer+'</p></div>';tell('✓ Bonne réponse',true);clearTimeout(flashTimer);flashTimer=setTimeout(()=>{if(!g||g.ended)return;g.paused=false;next()},550)}function explain(q){const a=q.a,b=q.b,op=q.op,eq=q.answer;if(op==='*'){const round=Math.floor(b/10)*10,rem=b-round;if(b>=10&&rem>0){return ['On décompose '+b+' en '+round+' + '+rem+'.',a+' × '+round+' = '+a*round,a+' × '+rem+' = '+a*rem,a*round+' + '+a*rem+' = '+eq]}const base=Math.round(b/10)*10;if(b>=6&&base!==b&&Math.abs(base-b)<=3){return ['On arrondit '+b+' à '+base+'.',a+' × '+base+' = '+a*base,'On corrige de '+a+' × '+Math.abs(base-b)+' = '+a*Math.abs(base-b),a*base+(b>base?' + ':' − ')+a*Math.abs(base-b)+' = '+eq]}return ['On décompose en sommes répétées ou en doubles.',a+' × '+b+' = '+eq]}if(op==='+')
